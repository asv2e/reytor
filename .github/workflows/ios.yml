name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gecko-build:
    name: Build Gecko web engine
    runs-on: macos-26
    timeout-minutes: 360
    env:
      GECKO_OBJ: engine/firefox/obj-aarch64-apple-ios

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install native build dependencies
        run: brew install cmake nasm yasm pkg-config sccache

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Fetch Gecko source
        shell: bash
        run: ./tools/development/update-gecko.sh

      - name: Apply Gecko patches
        shell: bash
        run: |
          set -euo pipefail
          root_dir="$(pwd)"
          find "$root_dir/patches" -type f -name '*.patch' -print | sort | while IFS= read -r patch_file; do
            git -C engine/firefox apply --3way --whitespace=nowarn "$patch_file"
          done
          
      - name: Build Gecko
        shell: bash
        run: |
          ./tools/development/build-gecko.sh

      - name: Check GeckoView headers were exported
        shell: bash
        run: |
          ls -la "$GECKO_OBJ/dist/include/GeckoView/" || echo "GeckoView export dir missing"

      - name: Package Gecko build
        shell: bash
        run: |
          set -euo pipefail
          test -d "$GECKO_OBJ/dist"

          # dist entries (headers in dist/include, resources in dist/bin) are
          # symlinks into engine/firefox sources, which don't exist (patched)
          # in the iOS job. Replace them with real files.
          find "$GECKO_OBJ/dist" -type l | while IFS= read -r link; do
            if [[ -e "$link" ]]; then
              cp -L "$link" "$link.tmp" && mv -f "$link.tmp" "$link"
            fi
          done
          test -d engine/firefox/toolkit/mozapps/extensions/default-theme

          tar -cf gecko-build.tar \
            -C engine/firefox \
            obj-aarch64-apple-ios/dist \
            toolkit/mozapps/extensions/default-theme

          ls -lh gecko-build.tar

      - name: Upload Gecko build
        uses: actions/upload-artifact@v5
        with:
          name: reytor-gecko-${{ github.sha }}
          path: gecko-build.tar
          if-no-files-found: error
          retention-days: 3

  ios-release:
    name: Build unsigned iOS app
    needs: gecko-build
    runs-on: macos-26
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      XCODE_PROJECT: browser/Reynard.xcodeproj
      XCODE_SCHEME: Reynard
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: Install native build dependencies
        run: brew install cmake nasm yasm pkg-config ldid

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Download Gecko build
        uses: actions/download-artifact@v6
        with:
          name: reytor-gecko-${{ github.sha }}
          path: .

      - name: Restore Gecko build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p engine/firefox
          tar -xf gecko-build.tar -C engine/firefox

          test -d engine/firefox/obj-aarch64-apple-ios/dist
          test -d engine/firefox/toolkit/mozapps/extensions/default-theme

          rm -f gecko-build.tar

      - name: Clone iDevice sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 \
            https://github.com/jkcoxson/idevice \
            support/idevice

      - name: Build Rust dependencies
        shell: bash
        run: |
          ./tools/development/build-idevice.sh
          ./tools/development/build-arti.sh

      - name: Build nightly release packages
        shell: bash
        run: |
          set -euo pipefail

          ./tools/release/build-app.sh --no-signing
          ./tools/release/create-ipa.sh
          ./tools/release/create-ipa.sh --trollstore
          ./tools/release/create-ipa.sh --jailbroken

          ls -l dist

      - name: Upload nightly artifacts
        uses: actions/upload-artifact@v5
        with:
          name: reytor-ios-nightly
          path: |
            dist/Reytor.ipa
            dist/Reytor-TrollStore.tipa
            dist/Reytor-Jailbroken.ipa

      - name: Publish nightly GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Reytor Nightly
          prerelease: true
          generate_release_notes: true
          files: |
            dist/Reytor.ipa
            dist/Reytor-TrollStore.tipa
            dist/Reytor-Jailbroken.ipa
